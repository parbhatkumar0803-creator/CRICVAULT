
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Contact Us </title>
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="contact_us.css">
</head>

<body>

    <header>
        <h1>
            <a href="index.html">
                CRIC<span>VAULT</span>
            </a>
        </h1>

        <p>
            <a href="index.html">Home</a>
            <a href="products.html">Products</a>
            <a href="about_us.html">About Us</a>
            <a href="contact_us.html">Contact</a>
        </p>
    </header>

    <div id="hero">
        <h2>LET'S TALK <span>CRICKET.</span></h2>
        <h3>
            Have a question about cricket equipment?
            We're here to help.
        </h3>
    </div>

    <div class="contact-container">


        <div id="form">

            <h2>Send a Message</h2>

            <form id="contactForm">

                <input
                    type="text"
                    name="name"
                    placeholder="Your Name"
                    required
                >

                <input
                    type="email"
                    name="email"
                    placeholder="Your Email Address"
                    required
                >

                <input
                    type="text"
                    name="subject"
                    placeholder="Subject"
                    required
                >

                <textarea
                    name="message"
                    placeholder="Your Message"
                    rows="5"
                    required
                ></textarea>

                <button type="submit">
                    SEND MESSAGE
                </button>

            </form>

        </div>

    </div>

    <footer>
        <hr>
        <p>© 2026 CricVault. All rights reserved.</p>
    </footer>


</body>
</html>
